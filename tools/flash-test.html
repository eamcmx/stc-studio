<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STC flash test</title>
<style>
  :root { --bg: #fbfaf6; --card: #fff; --ink: #1d1d1b; --muted: #5d5d57; --brand: #2F5496; --ok: #1b7a3a; --bad: #b3261e; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; }
  main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
  h1 { font: 600 22px/1.3 Georgia, serif; margin: 0 0 4px; }
  p { color: var(--muted); margin: 4px 0 16px; }
  .card { background: var(--card); border: 1px solid #e4e1d8; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  button, select { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #c9c5b9; background: #fff; cursor: pointer; }
  button.main { background: var(--brand); color: #fff; border-color: var(--brand); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #state { font-weight: 600; }
  progress { width: 100%; height: 10px; }
  pre { background: #f3f1ea; border-radius: 6px; padding: 8px; max-height: 320px; overflow: auto; font: 12px/1.4 "JetBrains Mono", Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>STC89C52RC flash test</h1>
  <p>Step 3 of STC Studio: write a Keil-built hex file to the board from this page, without AiCube-ISP.</p>
  <div class="card">
    <div class="row">
      <button id="pick" class="main">Choose the board's port</button>
      <span id="port">no port yet</span>
    </div>
  </div>
  <div class="card">
    <div class="row">
      <select id="file">
        <option value="../ref/m1/demo2_keil.hex">demo2.hex (Keil build, 1753 bytes)</option>
        <option value="../ref/m1/ex2_keil.hex">his Ex 2 counter (Keil build, 119 bytes)</option>
      </select>
      <select id="baud">
        <option value="19200">19200 baud</option>
        <option value="9600">9600 baud</option>
      </select>
      <button id="flash" class="main" disabled>Flash</button>
      <button id="close" disabled>Close the port</button>
    </div>
    <p id="state">Not connected.</p>
    <progress id="bar" value="0" max="1"></progress>
  </div>
  <pre id="log"></pre>
</main>
<script src="../src/asm51.js"></script>
<script src="../src/stcisp.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const logEl = $('log');
  const log = s => { logEl.textContent += new Date().toISOString().slice(11, 23) + '  ' + s + '\n'; logEl.scrollTop = 1e9; };
  window.flashLog = () => logEl.textContent;
  let port = null, transport = null, busy = false;
  if (!('serial' in navigator)) { $('state').textContent = 'This browser has no Web Serial. Use Chrome or Edge.'; $('pick').disabled = true; }

  async function usePort(p) {
    port = p;
    const i = p.getInfo();
    $('port').textContent = 'port chosen (USB ' + (i.usbVendorId || 0).toString(16) + ':' + (i.usbProductId || 0).toString(16) + ')';
    $('flash').disabled = false;
  }
  $('pick').onclick = async () => {
    try { await usePort(await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x1A86 }] })); }
    catch (e) { log('no port chosen: ' + e.message); }
  };
  // a port granted earlier comes back without asking
  if ('serial' in navigator) navigator.serial.getPorts().then(ps => { if (ps.length) usePort(ps[0]); });

  async function flash() {
    if (busy) return 'busy';
    busy = true; $('flash').disabled = true;
    const t0 = performance.now();
    try {
      const baud = +$('baud').value;
      const text = await (await fetch($('file').value, { cache: 'no-store' })).text();
      const img = ASM51.readHex(text);
      log('file ' + $('file').value + ': ' + img.size + ' bytes up to ' + img.top.toString(16).toUpperCase() + 'H');
      if (!transport) {
        transport = new StcIsp.WebSerialTransport(port, baud);
        await transport.open();
        $('close').disabled = false;
        log('port open at ' + baud + ' baud, DTR and RTS on');
      } else if (transport.baud !== baud) throw new Error('close the port first to change the baud rate');
      const isp = new StcIsp(transport, { log, progress: (n, total) => { $('bar').max = total; $('bar').value = n; } });
      $('state').textContent = 'Restarting the chip...';
      const info = await isp.connect();
      $('state').textContent = 'Writing to ' + info.model + '...';
      const r = await isp.program(img.image, img.used);
      const s = ((performance.now() - t0) / 1000).toFixed(1);
      $('state').textContent = 'Done: ' + r.bytes + ' bytes written and checked in ' + s + ' s. The program is running.';
      log('done in ' + s + ' s');
      return 'ok ' + s;
    } catch (e) {
      $('state').textContent = 'Stopped: ' + e.message;
      log('ERROR ' + e.message);
      return 'error ' + e.message;
    } finally { busy = false; $('flash').disabled = false; }
  }
  window.flashNow = flash;
  $('flash').onclick = flash;
  $('close').onclick = async () => {
    try { await transport.close(); log('port closed'); } catch (e) { log('close: ' + e.message); }
    transport = null; $('close').disabled = true;
  };
</script>
</body>
</html>
